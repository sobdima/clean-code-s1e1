<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <img class="header__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix picture">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </header>
  <main class="main">
    <form class="form">
      <label for="new-task" class="form__label">Add Item</label>
      <div class="form__task-wrap">
        <input id="new-task" class="form__input task" type="text">
        <button class="btn">Add</button>
      </div>
    </form>
    <h3 class="title">Todo</h3>
    <ul id="incomplete-tasks-wrap" class="todo__list list">
      <li class="list__item">
        <input type="checkbox" class="checkbox">
        <label class="task task__label">Pay Bills</label>
        <input type="text" class="task task__input">
        <button class="btn btn_edit">Edit</button>
        <button class="btn btn_delete">
          <img class="btn__icon" src="./remove.svg" alt="remove button icon">
        </button>
      </li>
      <li class="list__item list__item_edit-mode">
        <input type="checkbox" class="checkbox">
        <label class="task task__label">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task task__input">
        <button class="btn btn_edit">Save</button>
        <button class="btn btn_delete">
          <img class="btn__icon" src="./remove.svg" alt="remove button icon">
        </button>
      </li>
    </ul>
    <h3 class="title">Completed</h3>
    <ul id="completed-tasks" class="completed__list list">
      <li class="list__item">
        <input type="checkbox" class="checkbox" checked>
        <label class="task task__label">See the Doctor</label>
        <input type="text" class="task task__input">
        <button class="btn btn_edit">Edit</button>
        <button class="btn btn_delete">
          <img class="btn__icon" src="./remove.svg" alt="remove button icon">
        </button>
      </li>
    </ul>
  </main>
  <script src="app.js"></script>
</body>

</html>
